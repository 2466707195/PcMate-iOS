name: PcMate

options:
  bundleIdPrefix: com.aurora
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true
  groupSortPosition: top
  # 锁定 Xcode 15.4 的工程格式；CI 必须使用 scripts/install-xcodegen.sh 安装的 2.38.0
  xcodeVersion: "15.4"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.4"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    exactVersion: 0.11.0
  SwiftNIOSSH:
    url: https://github.com/Joannis/swift-nio-ssh.git
    exactVersion: 0.3.3
  SwiftNIO:
    url: https://github.com/apple/swift-nio.git
    exactVersion: 2.65.0
  SwiftCrypto:
    url: https://github.com/apple/swift-crypto.git
    exactVersion: 2.0.0

targets:
  PcMate:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - path: PcMate
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: Citadel
      - package: SwiftNIOSSH
        product: NIOSSH
      - package: SwiftNIO
        product: NIOCore
      - package: SwiftNIO
        product: NIOFoundationCompat
      - package: SwiftCrypto
        product: Crypto
      - package: SwiftCrypto
        product: _CryptoExtras
    info:
      path: PcMate/Resources/Info.plist
      properties:
        CFBundleDisplayName: PcMate
        CFBundleShortVersionString: "1.6.0"
        CFBundleVersion: "14"
        CFBundleDevelopmentRegion: zh-Hans
        UILaunchScreen:
          UIColorName: LaunchBackground
        # 不写 UIUserInterfaceStyle：外观完全交给「界面主题」决定
        # （PcMateApp 里按主题深浅设置 preferredColorScheme）
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        NSLocalNetworkUsageDescription: PcMate 需要访问局域网：连接你电脑上的 PcMate Agent，并发现和使用网络中的打印机。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aurora.pcmate.ios
        PRODUCT_NAME: PcMate
        MARKETING_VERSION: "1.6.0"
        CURRENT_PROJECT_VERSION: "14"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: PcMate

schemes:
  PcMate:
    build:
      targets:
        PcMate: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
